groups:
  - name: vigieau_alerts
    rules:
      - alert: TauxErreurEleve
        expr: >
          sum(rate(flask_http_request_total{status=~"5.."}[5m]))
          /
          sum(rate(flask_http_request_total[5m]))
          > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Taux d'erreur serveur élevé sur VigiEau"
          description: >
            Plus de 5% des requêtes des 5 dernières minutes ont retourné un
            code 5xx (valeur actuelle : {{ $value | humanizePercentage }}).

      - alert: LatenceP95Elevee
        expr: >
          histogram_quantile(0.95,
            sum(rate(flask_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Latence p95 élevée sur VigiEau"
          description: >
            Le 95e centile de latence dépasse 2 secondes sur les 5 dernières
            minutes (valeur actuelle : {{ $value | humanizeDuration }}).
