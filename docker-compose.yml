version: "3.9"

services:
  vigieau:
    build: .
    ports:
      - "8080:8080"
    environment:
      # ── Obligatoires ───────────────────────────────────────────
      - DATABASE_URL=sqlite:////data/vigieau.db
      - MLFLOW_TRACKING_URI=sqlite:////data/mlflow_water.db
      - MLFLOW_URI=${MLFLOW_URI:-models:/WaterQualityXGBoost/1}
      - SCALER_PATH=/app/model_artifacts/robust_scaler.pkl
      # ── OCR ────────────────────────────────────────────────────
      - OCR_SPACE_API_KEY=${OCR_SPACE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # ── Limites ────────────────────────────────────────────────
      - MAX_UPLOAD_MB=20
      - FLASK_ENV=production
    volumes:
      - vigieau_data:/data
      - ./model_artifacts:/app/model_artifacts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Monitorage applicatif (C20) ────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    depends_on:
      - vigieau

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=vigieau
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  vigieau_data:
  prometheus_data:
  grafana_data:
